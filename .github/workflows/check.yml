name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run release:pack
      - run: bun run release:verify
      - run: bun run site:build
      - run: bun run site:verify
      - run: bunx --no-install playwright install --with-deps chromium webkit --only-shell
        working-directory: packages/website
      - run: bun run site:test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: website-browser-traces
          path: packages/website/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: code-observation-images
          path: packages/website/test-results/observation-images/
          if-no-files-found: ignore
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: docker build --label "openeval.verification=$(bun -e 'import {treeHash} from "./packages/openeval/src/infra/files"; console.log(await treeHash("packages/openeval/src/infra/verification/runtime"));')" -t openeval-verification:0.5.0 packages/openeval/src/infra/verification/runtime
      - run: docker build --label "openeval.runtime=$(bun -e 'import {treeHash} from "./packages/openeval/src/infra/files"; console.log(await treeHash("packages/openeval/src/infra/containers/runtime"));')" -t openeval-runtime:2.0.22 packages/openeval/src/infra/containers/runtime
        timeout-minutes: 15
      - run: bun test packages/openeval/src/infra/verification/integration.test.ts
        env:
          OPENEVAL_VERIFY_INTEGRATION: "1"
